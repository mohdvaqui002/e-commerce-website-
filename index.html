    <!-- CSS Loading Splash Screen Style -->
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #ffffff;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #ff4141;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      .loader-text {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 4px;
        animation: pulse 1.5s ease-in-out infinite;
        background: linear-gradient(to right, #ff4141, #ff7a00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading Splash Screen (will be cleared when React mounts) -->
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">SHOPPER</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
